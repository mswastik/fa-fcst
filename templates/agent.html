{% extends "base.html" %}

{% block content %}
<div id="agent-container" x-data="agentData()" class="w-full">
        <h2 class="text-xl font-bold text-gray-800 mb-4">Medical Device Market Research Agent</h2>
        <!-- Input Section -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-3">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Product</label>
                <input 
                    type="text" 
                    id="product-input"
                    x-model="product"
                    class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border"
                    placeholder="Enter product (e.g. Medical Device)"
                />
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Region</label>
                <select 
                    id="region-input"
                    x-model="region"
                    class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border"
                >
                    <option value="">Select region...</option>
                    <option value="All Regions">All Regions</option>
                    <template x-for="region in regions" :key="region">
                        <option x-text="region" :value="region"></option>
                    </template>
                </select>
            </div>
            
            <div class="flex items-end">
                <button 
                    @click="runAgent"
                    :disabled="isSearching"
                    class="btn px-4 py-2 rounded-md"
                    x-text="isSearching ? 'Searching...' : 'Run Agent'"
                ></button>
            </div>
        </div>       
        <!-- Results Section -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-3">
            <!-- Left Side: Table -->
            <div class="lg:col-span-1">
                <div class="bg-gray-50 rounded-lg shadow p-4">
                    <h3 class="text-lg font-semibold mb-3">Business Unit & Country Data</h3>
                    <div class="overflow-y-auto max-h-96">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-100">
                                <tr>
                                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Business Unit</th>
                                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Country</th>
                                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Last Year YoY</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                <template x-for="row in tableData" :key="row.row_id">
                                    <tr 
                                        class="hover:bg-gray-50 cursor-pointer" 
                                        :class="{'bg-blue-100': selectedRow && selectedRow.row_id === row.row_id}"
                                        @click="selectRow(row)"
                                    >
                                        <td class="px-3 py-2 whitespace-nowrap text-sm text-gray-900" x-text="row.business_unit"></td>
                                        <td class="px-3 py-2 whitespace-nowrap text-sm text-gray-900" x-text="row.country"></td>
                                        <td class="px-3 py-2 whitespace-nowrap text-sm text-gray-900" x-text="row.last_year_yoy ? row.last_year_yoy + '%' : 'N/A'"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <!-- Right Side: Output -->
            <div class="lg:col-span-2">
                <div class="bg-gray-50 rounded-lg shadow p-4 h-full flex flex-col">
                    <div class="flex justify-between">
                    <h3 class="text-lg font-semibold mb-3">Agent Output</h3>
                    <button 
                        @click="showConfig = !showConfig"
                        class="btn text-sm h-8 py-1"
                    >
                        <span x-text="showConfig ? 'Hide Config' : 'Agent Config'"></span>
                    </button>
                    </div>
                    <!-- Search Configuration Panel -->
                    <div 
                        x-show="showConfig" 
                        class="bg-blue-50 rounded-lg p-4 mt-3 transition-all duration-300"
                    >
                        <h4 class="font-medium mb-2">Agent Configuration</h4>
                        
                        <div class="mb-3">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Search Query 1</label>
                            <textarea 
                                x-model="searchQuery1" 
                                class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border h-16"
                                placeholder="Template for first search query"
                            ></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Search Query 2</label>
                            <textarea 
                                x-model="searchQuery2" 
                                class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border h-16"
                                placeholder="Template for second search query"
                            ></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Agent Role</label>
                            <select x-model="role" class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
                                <option value="Demand Planner">Demand Planner</option>
                                <option value="Market Analyst">Market Analyst</option>
                                <option value="Business Development Manager">Business Development Manager</option>
                                <option value="Devil's Advocate">Devil's Advocate</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Objective</label>
                            <textarea 
                                x-model="objective" 
                                class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border h-24"
                                placeholder="Agent objective"
                            ></textarea>
                        </div>
                        
                        <button 
                            @click="resetConfig"
                            class="btn text-sm"
                        >
                            Reset to Defaults
                        </button>
                    </div>
                    
                    
                    <div 
                        id="output-area"
                        class="bg-white rounded border p-4 flex-grow overflow-y-auto mb-3 min-h-96 prose prose-sm sm:prose-base lg:prose-lg text-gray-900"
                        x-html="outputHtml"
                    ></div>
                    
                </div>
            </div>
        </div>

</div>

<script>
    function agentData() {
        return {
            product: '',
            region: '',
            regions: [],
            tableData: [],
            selectedRow: null,
            outputHtml: '',
            isSearching: false,
            showConfig: false,
            showSources: false, // New property for collapsible sources
            sources: [], // Store sources data
            contentBuffer: '', // Buffer to accumulate tokens
            
            // Configuration
            searchQuery1: '{product} medical device category market growth potential for next 5 years in {region}',
            searchQuery2: '{product} medical device category competitors of Stryker in {region}',
            role: 'Demand Planner',
            objective: 'help demand planners generate long term forecasts by providing insights on market dynamics that can impact demand of Stryker {product} medical device in {region} in coming years both positively and negatively. Based on the given context, give your opinion whether the Stryker\'s forecast should be updated or not.',
            
            init() {
                this.loadRegions();
                this.loadTableData();
            },
            
            async loadRegions() {
                try {
                    const response = await fetch('/api/regions');
                    const data = await response.json();
                    // Extract unique countries from the response
                    this.regions = data.countries || [];
                } catch (error) {
                    console.error('Error loading regions:', error);
                }
            },
            
            async loadTableData() {
                try {
                    const response = await fetch('/api/agent-table-data');
                    const data = await response.json();
                    this.tableData = data.rows || [];
                } catch (error) {
                    console.error('Error loading table data:', error);
                }
            },
            
            selectRow(row) {
                this.selectedRow = row;
                this.product = row.business_unit;
                this.region = row.country;
            },
            
            async runAgent() {
                if (!this.product || !this.region) {
                    alert('Please enter both product and region');
                    return;
                }
                
                this.isSearching = true;
                this.outputHtml = '<div class="flex justify-center items-center"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div><span class="ml-2">Running agent...</span></div>';
                
                try {
                    const response = await fetch('/api/agent-stream', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            product: this.product,
                            region: this.region,
                            search_query1: this.searchQuery1,
                            search_query2: this.searchQuery2,
                            role: this.role,
                            objective: this.objective
                        })
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    // Clear the output area to prepare for streaming
                    this.outputHtml = '';
                    this.sources = []; // Reset sources
                    this.showSources = false; // Hide sources initially
                    this.showDetails = false; // For <details> content
                    //this.contentBuffer = '';
                    
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';
                    
                    // Log the API call for debugging
                    console.log('Starting agent stream for:', { product: this.product, region: this.region });
                    
                    while (true) {
                        const { done, value } = await reader.read();
                        
                        if (done) {
                            console.log('Stream finished');
                            break;
                        }
                        
                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop(); // Keep last partial line in buffer
                        
                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                try {
                                    const data = JSON.parse(line.slice(6)); // Remove 'data: ' prefix
                                    
                                    console.log('Received data:', data);
                                    
                                    if (data.type === 'status') {
                                        // Update status message
                                        this.outputHtml = `<div class="text-blue-600">${data.message}</div>`;
                                    } else if (data.type === 'start_summary') {
                                        // Show sources first if available
                                        if (data.sources && data.sources.length > 0) {
                                            this.sources = data.sources;
                                            let sourcesHtml = `
                                                <div class="mb-4">
                                                    <div class="bg-gray-100 rounded-lg shadow-sm p-4 border border-gray-200">
                                                        <div class="flex items-center justify-between cursor-pointer" @click="showSources = !showSources">
                                                            <h4 class="font-semibold text-gray-800">Sources</h4>
                                                            <span class="ml-2" x-text="showSources ? '▲' : '▼'" class="text-gray-600"></span>
                                                        </div>
                                                        <div x-show="showSources" class="mt-4 transition-all duration-300 ease-in-out" style="overflow: hidden;" x-collapse>
                                                            <ul class="list-disc pl-5 space-y-2">
                                            `;
                                            data.sources.forEach((source, index) => {
                                                sourcesHtml += `<li><a href="${source.url}" target="_blank" class="text-blue-600 hover:underline hover:text-blue-800">${source.url}</a></li>`;
                                            });
                                            sourcesHtml += `
                                                            </ul>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div id="streaming-content" class="prose max-w-none mt-4"></div>
                                            `;
                                            this.outputHtml = sourcesHtml;
                                        } else {
                                            // If no sources, just start with streaming content
                                            this.outputHtml = '<div id="streaming-content" class="prose max-w-none"></div>';
                                        }
                                    } else if (data.type === 'chunk') {
                                        // Append the new chunk to the content buffer
                                        this.contentBuffer += data.content;
                                        
                                        // Process the accumulated content and update the display
                                        const streamingDiv = document.getElementById('streaming-content');
                                        if (streamingDiv) {
                                            // Simple text processing - just escape HTML and handle basic formatting
                                            const processedContent = this.processContent(this.contentBuffer);
                                            streamingDiv.innerHTML = processedContent;
                                            
                                            // Scroll to bottom to see new content
                                            streamingDiv.parentElement.scrollTop = streamingDiv.parentElement.scrollHeight;
                                        }
                                    } else if (data.type === 'complete') {
                                        // Processing is complete - just process any potential details elements that need formatting
                                        const streamingDiv = document.getElementById('streaming-content');
                                        if (streamingDiv) {
                                            this.processDetailsElements();
                                        }
                                    } else if (data.type === 'error') {
                                        this.outputHtml = `<div class="text-red-600">Error: ${data.message}</div>`;
                                    }
                                } catch (e) {
                                    // Ignore malformed JSON lines
                                    console.warn('Could not parse SSE data:', line, 'Error:', e);
                                }
                            }
                        }
                    }
                } catch (error) {
                    console.error('Error in runAgent:', error);
                    this.outputHtml = `<div class="text-red-600">Error: ${error.message}</div>`;
                } finally {
                    this.isSearching = false;
                }
            },
            
            // Escape HTML to prevent XSS
            escapeHtml: function(text) {
                return text
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            },
            
            // Simple content processor that only handles basic formatting
            processContent: function(text) {
                if (!text) return '';
                
                // First, escape HTML to prevent XSS
                let content = this.escapeHtml(text);
                
                // Convert newlines to <br> tags for proper line breaks
                content = content.replace(/\n/g, '<br>');
                
                // Handle bold text
                content = content.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                
                // Handle italic text
                content = content.replace(/\*(.*?)\*/g, '<em>$1</em>');
                
                return content;
            },
            
            // Process any <details> and <summary> elements to make them collapsible
            processDetailsElements: function() {
                const detailsElements = document.querySelectorAll('details');
                detailsElements.forEach((details, index) => {
                    if (!details.hasAttribute('data-processed')) {
                        details.setAttribute('data-processed', 'true');
                        details.classList.add('bg-gray-100', 'rounded', 'p-3', 'mt-2', 'mb-2');
                        
                        const summary = details.querySelector('summary');
                        if (summary) {
                            summary.classList.add('font-semibold', 'cursor-pointer', 'list-none');
                            summary.style.listStyle = 'none';
                            
                            // Add custom indicator for expand/collapse
                            summary.insertAdjacentHTML('beforeend', '<span class="float-right ml-2">▼</span>');
                            
                            details.addEventListener('toggle', function() {
                                const indicator = this.querySelector('summary span:last-child');
                                if (indicator) {
                                    indicator.textContent = this.open ? '▲' : '▼';
                                }
                            });
                        }
                    }
                });
            },
            
            resetConfig() {
                this.searchQuery1 = '{product} medical device category market growth potential for next 5 years in {region}';
                this.searchQuery2 = '{product} medical device category competitors of Stryker in {region}';
                this.role = 'Demand Planner';
                this.objective = 'help demand planners generate long term forecasts by providing insights on market dynamics that can impact demand of Stryker {product} medical device in {region} in coming years both positively and negatively. Based on the given context, give your opinion whether the Stryker\'s forecast should be updated or not.';
            }
        }
    }
</script>
{% endblock %}
