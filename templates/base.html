<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Integration Forecast Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- TomSelect for searchable selects -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
    
    <!-- HTMX -->
    <script src="/static/js/htmx.min.js"></script>
    
    <!-- Alpine.js -->
    <script defer src="/static/js/alpine.min.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
    
    <!-- jQuery for PivotTable.js -->
    <script src="/static/js/jquery-3.7.1.min.js"></script>
    
    <!-- PivotTable.js -->
    <script src="/static/js/pivot.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Loading indicator for HTMX -->
    <style>
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator {
            display: inline;
        }
        .htmx-request.htmx-indicator {
            display: inline;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div x-data="{ drawerOpen: false }" class="min-h-screen">
        <!-- Header -->
        <header class="bg-white shadow-sm border-b py-1">
            <div class="w-full justify-between items-center px-4 py-1 flex">
                <!-- Left side: App title and navigation -->
                <div class="items-center gap-4 flex">
                    <a href="/"><span class="text-lg font-bold text-gray-800 mr-4">ML Integration</span></a>
                    <!-- Navigation links -->
                    <div class="items-center gap-1 flex">
                        <a href="/" class="text-sm px-3 py-1 rounded transition-colors duration-200 bg-blue-100 text-blue-700 font-semibold no-underline">Dashboard</a>
                        <a href="/raw_data" class="text-sm px-3 py-1 rounded transition-colors duration-200 text-gray-600 hover:bg-gray-100 no-underline">Raw Data</a>
                        <a href="/agent" class="text-sm px-3 py-1 rounded transition-colors duration-200 text-gray-600 hover:bg-gray-100 no-underline">Agent</a>
                    </div>
                </div>
                
                <!-- Right side: User info and auth buttons -->
                <div class="items-center gap-4 flex">
                    <div class="items-center gap-x-2 flex">
                        <icon class="text-blue-600 account_circle"></span>
                        <span class="text-sm text-gray-700">User</span>
                    </div>
                    <button class="text-sm text-gray-600 hover:bg-gray-100 px-3 py-1 rounded transition-colors duration-200 no-underline">Logout</button>
                </div>
            </div>
        </header>
        
        <!-- Main content -->
        <main class="container w-full mx-auto px-4 py-6">
            <div id="main-content">
                <!-- Content will be loaded here by individual pages -->
                {% block content %}{% endblock %}
            </div>
        </main>
        
        <!-- Loading indicator -->
        <div class="htmx-indicator fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-white p-6 rounded-lg shadow-xl z-50">
            <div class="flex flex-col items-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mb-3"></div>
                <span>Loading...</span>
            </div>
        </div>
    </div>
</body>
</html>
