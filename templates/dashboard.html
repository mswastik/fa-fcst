{% extends "base.html" %}

{% block content %}
<div id="dashboard-container">
    <!-- Filters Row -->
    <div id="filters-row" class="w-full gap-2 flex mb-4">
        <div class="min-w-[100px] flex-1 max-w-[150px]">
            <label class="block text-sm font-medium text-gray-700">Location</label>
            <select
                id="location-select1"
                name="location1"
                class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm py-2 tom-select"
                hx-post="/api/filters"
                hx-include="[name='location2'], [name='product1'], [name='product2']"
                hx-target="#location-select2-container"
                hx-swap="innerHTML"
                hx-vals="js:{filter_name: 'location1'}"
                hx-indicator=".htmx-indicator"
                hx-trigger="change"
            >
                <option value="Region" selected>Region</option>
                <option value="Country">Country</option>
                <option value="Area">Area</option>
            </select>
        </div>
        
        <div id="location-select2-container" class="min-w-[160px] flex-1 max-w-[200px]">
            <label class="block text-sm font-medium text-gray-700" id="location2-label">Region</label>
            <select
                name="location2"
                class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm py-2 tom-select"
                hx-post="/api/update"
                hx-include="[name='location1'], [name='location2'], [name='product1'], [name='product2']"
                hx-target="#dashboard-content"
                hx-trigger="change"
                hx-indicator=".htmx-indicator"
                hx-swap="innerHTML"
            >
                <option value="">Select region...</option>
                {% for option in initial_location_options %}
                <option value="{{ option }}">{{ option }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="min-w-[140px] flex-1 max-w-[150px]">
            <label class="block text-sm font-medium text-gray-700">Product</label>
            <select
                id="product-select1"
                name="product1"
                class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm py-2 tom-select"
                hx-post="/api/filters"
                hx-include="[name='location1'], [name='location2'], [name='product2']"
                hx-target="#product-select2-container"
                hx-swap="innerHTML"
                hx-vals="js:{filter_name: 'product1'}"
                hx-indicator=".htmx-indicator"
                hx-trigger="change"
            >
                <option value="Franchise" selected>Franchise</option>
                <option value="IBP Level 5">IBP Level 5</option>
                <option value="IBP Level 6">IBP Level 6</option>
                <option value="CatalogNumber">CatalogNumber</option>
            </select>
        </div>
        
        <div id="product-select2-container" class="min-w-[160px] flex-1 max-w-[250px]">
            <label class="block text-sm font-medium text-gray-700" id="product2-label">Franchise</label>
            <select
                name="product2"
                class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm py-2 tom-select"
                hx-post="/api/update"
                hx-include="[name='location1'], [name='location2'], [name='product1'], [name='product2']"
                hx-target="#dashboard-content"
                hx-trigger="change"
                hx-indicator=".htmx-indicator"
                hx-swap="innerHTML"
            >
                <option value="">Select option...</option>
                {% for option in initial_product_options %}
                <option value="{{ option }}">{{ option }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="min-w-[160px] flex-1 max-w-[250px]">
            <label class="block text-sm font-medium text-gray-700">Forecast Version</label>
            <select
                name="forecast_version"
                class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm py-2 tom-select"
                hx-post="/api/update"
                hx-include="[name='location1'], [name='location2'], [name='product1'], [name='product2'], [name='forecast_version']"
                hx-target="#dashboard-content"
                hx-trigger="change"
                hx-indicator=".htmx-indicator"
                hx-swap="innerHTML"
            >
                <option value="">Select version...</option>
                {% for version in forecast_versions %}
                <option value="{{ version }}">{{ version }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    
    <!-- Action Buttons -->
    <div class="w-full gap-2 flex mb-4">
        <button 
            class="btn px-4 py-2 rounded"
            hx-post="/api/actions"
            hx-include="[name='location1'], [name='location2'], [name='product1'], [name='product2']"
            hx-vals="js:{action: 'segmentation'}"
            hx-target="#dashboard-content"
            hx-swap="innerHTML"
            hx-indicator=".htmx-indicator"
        >
            Segmentation
        </button>
        <button 
            class="btn px-4 py-2 rounded"
            hx-post="/api/actions"
            hx-include="[name='location1'], [name='location2'], [name='product1'], [name='product2']"
            hx-vals="js:{action: 'forecast'}"
            hx-target="#dashboard-content"
            hx-swap="innerHTML"
            hx-indicator=".htmx-indicator"
        >
            Generate Forecast
        </button>

            class="btn secondary px-4 py-2 rounded"
            hx-post="/api/actions"
            hx-include="[name='location1'], [name='location2'], [name='product1'], [name='product2']"
            hx-vals="js:{action: 'validate'}"
            hx-target="#dashboard-content"
            hx-swap="innerHTML"
            hx-indicator=".htmx-indicator"
        >
            Validate Models
        </button>
        <button 
            class="btn px-4 py-2 rounded"
            hx-post="/api/actions"
            hx-include="[name='location1'], [name='location2'], [name='product1'], [name='product2']"
            hx-vals="js:{action: 'change_fc'}"
            hx-target="#dashboard-content"
            hx-swap="innerHTML"
            hx-indicator=".htmx-indicator"
        >
            Change FC
        </button>
        <button

            hx-post="/api/actions"
            hx-include="[name='location1'], [name='location2'], [name='product1'], [name='product2']"
            hx-vals="js:{action: 'view'}"
            hx-target="#dashboard-content"
            hx-swap="innerHTML"
            hx-indicator=".htmx-indicator"
        >
            View
        </button>
        -->
    </div>
    
    <!-- Dashboard Content -->
    <div id="dashboard-content">
        <!-- Charts will be loaded here -->
        <div id="charts-container">
            <div class="flex justify-center items-center h-64">
                <div class="text-gray-500">Select filters to view charts</div>
            </div>
        </div>
        
        <!-- Details Table -->
        <div class="w-full h-full mt-6 p-0">
            <h3 class="p-2 text-lg font-bold">Select Product and Model data</h3>
            <div id="details-table">
                <div class="p-8 text-center text-gray-500">
                    Please select all required filters to view data
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Initialize TomSelect for searchable dropdowns
    function initSearchableSelects() {
        const selects = document.querySelectorAll('select.tom-select');
        const processedElements = new Set();
        
        selects.forEach(function(select) {
            if (processedElements.has(select)) {
                return;
            }
            
            processedElements.add(select);
            const currentValue = select.value;
            
            if (select.tomselect) {
                select.tomselect.destroy();
            }
            
            const tomSelect = new TomSelect(select, {
                create: false,
                sortField: 'text',
                maxItems: 1,
                render: {
                    item: function(data, escape) {
                        return '<div class="truncate">' + escape(data.text) + '</div>';
                    },
                    option: function(data, escape) {
                        return '<div>' + escape(data.text) + '</div>';
                    }
                },
            });
            
            if (currentValue) {
                tomSelect.setValue(currentValue);
            }
            
            // Ensure HTMX processes the element
            if (window.htmx) {
                htmx.process(select);
            }
        });
    }
    
    // Initialize on DOM load
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
            initSearchableSelects();
        }, 100);
    });
    
    // Re-initialize after HTMX updates
    document.addEventListener('htmx:afterSwap', function(evt) {
        // Handle direct select updates
        if (evt.target.tagName === 'SELECT' && evt.target.classList.contains('tom-select')) {
            if (evt.target.tomselect) {
                evt.target.tomselect.destroy();
            }
            
            new TomSelect(evt.target, {
                create: false,
                sortField: 'text',
                maxItems: 1,
                render: {
                    item: function(data, escape) {
                        return '<div class="truncate">' + escape(data.text) + '</div>';
                    },
                    option: function(data, escape) {
                        return '<div>' + escape(data.text) + '</div>';
                    }
                },
            });
            
            if (window.htmx) {
                htmx.process(evt.target);
            }
        }
        // Handle container updates
        else if (evt.target.id === 'location-select2-container' || evt.target.id === 'product-select2-container') {
            const selectElement = evt.target.querySelector('select.tom-select');
            if (selectElement) {
                if (selectElement.tomselect) {
                    selectElement.tomselect.destroy();
                }
                
                new TomSelect(selectElement, {
                    create: false,
                    sortField: 'text',
                    maxItems: 1,
                    render: {
                        item: function(data, escape) {
                            return '<div class="truncate">' + escape(data.text) + '</div>';
                        },
                        option: function(data, escape) {
                            return '<div>' + escape(data.text) + '</div>';
                        }
                    },
                });
                
                if (window.htmx) {
                    htmx.process(selectElement);
                }
            }
        }
    });
</script>
{% endblock %}
