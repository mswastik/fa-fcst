{% extends "base.html" %}

{% block content %}
<div class="w-full">
    <h1 class="text-2xl font-bold mb-6">Raw Data View</h1>
    
    <div class="bg-white rounded-lg shadow p-6">
        <div class="mb-4">
            <h2 class="text-xl font-semibold mb-2">Sales and Forecast Data</h2>
            <p class="text-gray-600">Combined view of actual sales and forecast data</p>
        </div>
        
        <!-- Data table will go here -->
        <div id="raw-data-table-container" hx-get="/api/raw_data" hx-trigger="load" hx-target="this" hx-swap="innerHTML" hx-indicator=".htmx-indicator">
            <!-- Loading placeholder -->
            <div class="flex justify-center items-center h-32">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
